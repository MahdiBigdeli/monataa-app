<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>موناتا | مدیریت حقوق</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14b8a6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موناتا">
<link rel="icon" href="./icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0b3b3a;
    --teal-700:#0d9488;
    --teal-600:#10a89b;
    --teal-500:#14b8a6;
    --teal-100:#d9f2ef;
    --blue-600:#2563eb;
    --blue-500:#3b82f6;
    --sky-500:#38bdf8;
    --ink:#0f2027;
    --muted:#6b8583;
    --muted-2:#93a8a6;
    --bg:#eef6f6;
    --card:#ffffff;
    --border:#e3eeed;
    --danger:#ef4444;
    --amber:#f59e0b;
    --amber-bg:#fef3e2;
    --emerald:#10b981;
    --emerald-bg:#e7f9f1;
    --cat-food:#0d9488;
    --cat-transport:#2563eb;
    --cat-bills:#38bdf8;
    --cat-shopping:#0ea5e9;
    --cat-saving:#059669;
    --cat-other:#94a3b8;
    --r-lg:22px;
    --r-md:16px;
    --r-sm:12px;
    --shadow: 0 10px 30px -12px rgba(13,60,58,.18);
    --shadow-sm: 0 4px 14px -6px rgba(13,60,58,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', system-ui, sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #e6f7f6 0%, #eef4f5 45%, #e9eef2 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 12px;
  }
  .phone{
    width:100%;
    max-width:412px;
    background:var(--bg);
    border-radius:36px;
    box-shadow: var(--shadow), 0 0 0 10px #ffffff, 0 0 0 11px #d8e6e5;
    overflow:hidden;
    position:relative;
    min-height:840px;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:460px){
    body{padding:0;}
    .phone{border-radius:0; box-shadow:none; min-height:100vh; max-width:100%;}
  }
  .screen{ flex:1; overflow-y:auto; padding-bottom:96px; scrollbar-width:none; }
  .screen::-webkit-scrollbar{display:none;}
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top)) 20px 14px; }
  .topbar h1{ font-size:19px; font-weight:800; margin:0; }
  .icon-btn{
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:#fff; border:1px solid var(--border); color:var(--teal-700); cursor:pointer; flex-shrink:0;
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:active{ transform:scale(.92); }
  .icon-plain{ background:transparent; border:none; color:var(--ink); }
  .px{ padding-left:20px; padding-right:20px; }
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
  .section-title h2{ font-size:14.5px; font-weight:700; margin:0; color:var(--ink); }
  .link-btn{ background:none;border:none;color:var(--teal-700); font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:0;}

  /* ---- cards ---- */
  .hero-card{
    background: linear-gradient(135deg, var(--teal-600), var(--teal-500) 60%, #17c3b3);
    border-radius:var(--r-lg);
    padding:20px 20px 22px;
    color:#fff;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:"";
    position:absolute; inset:auto -40px -60px auto; width:150px;height:150px;border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .hero-label{ font-size:13px; opacity:.92; font-weight:600; }
  .hero-amount{ font-size:30px; font-weight:800; margin-top:10px; letter-spacing:.3px; }
  .hero-unit{ font-size:13px; font-weight:500; opacity:.85; margin-right:6px; }
  .hero-edit{
    width:32px;height:32px;border-radius:10px; background:rgba(255,255,255,.18); border:none;
    display:flex;align-items:center;justify-content:center; color:#fff; cursor:pointer;
  }
  .stat-row{ display:flex; gap:12px; margin-top:14px; }
  .stat-card{
    flex:1; background:var(--card); border-radius:var(--r-md); padding:14px 16px;
    box-shadow:var(--shadow-sm); border:1px solid var(--border);
  }
  .stat-card .lbl{ font-size:12px; color:var(--muted); font-weight:600; }
  .stat-card .val{ font-size:17px; font-weight:800; margin-top:6px; }
  .stat-card .val.neg{ color:var(--danger); }
  .stat-card .val.pos{ color:var(--teal-700); }

  .panel{
    background:var(--card); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
  }
  .donut-wrap{ display:flex; align-items:center; gap:16px; }
  .legend{ flex:1; display:flex; flex-direction:column; gap:9px; }
  .legend-row{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; }
  .legend-left{ display:flex; align-items:center; gap:8px; }
  .dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }
  .legend-name{ color:var(--ink); font-weight:600; }
  .legend-pct{ color:var(--muted); font-weight:700; }
  .empty-hint{ text-align:center; color:var(--muted-2); font-size:13px; padding:18px 6px; }

  .tx-row{
    display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border);
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-icon{ width:42px;height:42px;border-radius:13px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .tx-mid{ flex:1; min-width:0; }
  .tx-name{ font-size:14px; font-weight:700; }
  .tx-sub{ font-size:11.5px; color:var(--muted-2); margin-top:2px; }
  .tx-amt{ font-size:14px; font-weight:800; white-space:nowrap; }
  .tx-del{ background:none;border:none;color:var(--muted-2); cursor:pointer; padding:6px; flex-shrink:0; }

  .asset-card{
    display:flex; align-items:center; gap:13px; background:var(--card); border-radius:var(--r-md);
    padding:14px 16px; box-shadow:var(--shadow-sm); border:1px solid var(--border); margin-bottom:12px; cursor:pointer;
    transition:transform .12s ease;
  }
  .asset-card:active{ transform:scale(.98); }
  .asset-icon{ width:46px;height:46px;border-radius:14px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .asset-mid{ flex:1; }
  .asset-name{ font-size:14.5px; font-weight:800; }
  .asset-sub{ font-size:12px; color:var(--muted); margin-top:3px; }
  .asset-val{ font-size:13.5px; font-weight:700; color:var(--ink); }

  .total-hero{
    background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
    border-radius:var(--r-lg); padding:22px 20px; color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .total-hero::after{ content:""; position:absolute; inset:-30px -30px auto auto; width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08); }
  .total-top{ display:flex; justify-content:space-between; align-items:center; }
  .total-icon{ width:44px;height:44px;border-radius:13px; background:rgba(255,255,255,.18); display:flex;align-items:center;justify-content:center;}

  /* ---- bottom nav ---- */
  .bottomnav{
    position:absolute; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-around; padding:10px 6px 14px; z-index:20;
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; background:none;border:none; cursor:pointer; color:var(--muted-2); font-family:inherit; padding:4px 10px; }
  .nav-item.active{ color:var(--teal-700); }
  .nav-item span{ font-size:10.5px; font-weight:600; }
  .fab{
    width:54px;height:54px;border-radius:18px; background:linear-gradient(135deg,var(--teal-600),var(--teal-500));
    display:flex;align-items:center;justify-content:center; color:#fff; border:none; cursor:pointer;
    margin-top:-34px; box-shadow:0 10px 20px -6px rgba(13,148,136,.55); flex-shrink:0;
  }
  .fab:active{ transform:scale(.94); }

  /* ---- modal / sheet ---- */
  .overlay{
    position:absolute; inset:0; background:rgba(10,30,29,.42); display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; background:#fff; border-radius:26px 26px 0 0; padding:18px 20px 26px; max-height:88%; overflow-y:auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet-handle{ width:38px;height:4px;border-radius:3px; background:var(--border); margin:0 auto 14px; }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-head h3{ margin:0; font-size:16.5px; font-weight:800; }

  .tabs{ display:flex; gap:6px; background:#f1f6f6; padding:4px; border-radius:14px; margin-bottom:16px; }
  .tab-btn{
    flex:1; padding:10px 4px; border:none; background:none; border-radius:11px; font-family:inherit;
    font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .tab-btn.active{ background:#fff; color:var(--teal-700); box-shadow:0 2px 8px rgba(13,60,58,.12); }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:8px; }
  .amount-input{
    width:100%; border:none; border-bottom:2px solid var(--border); font-family:inherit; font-size:26px; font-weight:800;
    padding:6px 2px; outline:none; color:var(--ink); background:transparent; direction:ltr; text-align:right;
  }
  .amount-input:focus{ border-color:var(--teal-500); }
  .text-input, .select-input{
    width:100%; border:1px solid var(--border); border-radius:13px; padding:12px 14px; font-family:inherit;
    font-size:13.5px; outline:none; color:var(--ink); background:#fafcfc;
  }
  .text-input:focus{ border-color:var(--teal-500); }
  .row-field{
    display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:13px;
    padding:12px 14px; background:#fafcfc; cursor:pointer;
  }
  .row-field .rf-left{ display:flex; align-items:center; gap:10px; color:var(--ink); font-size:13.5px; font-weight:600; }
  .row-field .rf-left svg{ color:var(--teal-700); }

  .cat-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .cat-item{
    display:flex; flex-direction:column; align-items:center; gap:6px; background:#fafcfc; border:1.5px solid var(--border);
    border-radius:14px; padding:10px 2px; cursor:pointer; font-family:inherit;
  }
  .cat-item.active{ border-color:var(--teal-500); background:var(--teal-100); }
  .cat-item .ci-ic{ width:32px;height:32px;border-radius:10px; display:flex;align-items:center;justify-content:center; }
  .cat-item span{ font-size:10.5px; font-weight:700; color:var(--ink); }

  .type-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px; }
  .type-item{
    display:flex; flex-direction:column; align-items:center; gap:7px; background:#fafcfc; border:1.5px solid var(--border);
    border-radius:14px; padding:12px 4px; cursor:pointer; font-family:inherit;
  }
  .type-item.active{ border-color:var(--teal-500); background:var(--teal-100); }
  .type-item .ti-ic{ width:36px;height:36px;border-radius:11px; display:flex;align-items:center;justify-content:center; }
  .type-item span{ font-size:10.5px; font-weight:700; color:var(--ink); text-align:center; }

  .primary-btn{
    width:100%; padding:15px; border:none; border-radius:15px; background:linear-gradient(135deg,var(--teal-600),var(--teal-500));
    color:#fff; font-family:inherit; font-size:14.5px; font-weight:800; cursor:pointer; box-shadow:0 8px 18px -6px rgba(13,148,136,.5);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .primary-btn:active{ transform:scale(.98); }
  .ghost-btn{
    width:100%; padding:14px; border:1.5px solid #fbdada; border-radius:15px; background:#fff6f6; color:var(--danger);
    font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:10px;
  }

  /* profile */
  .profile-hero{ display:flex; align-items:center; gap:14px; background:var(--card); border-radius:var(--r-lg); padding:18px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
  .avatar{ width:56px;height:56px;border-radius:16px; background:linear-gradient(135deg,var(--teal-100),#eaf6ff); display:flex;align-items:center;justify-content:center; color:var(--teal-700); flex-shrink:0; }
  .menu-list{ margin-top:18px; background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow-sm); border:1px solid var(--border); overflow:hidden; }
  .menu-row{ display:flex; align-items:center; justify-content:space-between; padding:15px 18px; border-bottom:1px solid var(--border); cursor:pointer; }
  .menu-row:last-child{ border-bottom:none; }
  .menu-left{ display:flex; align-items:center; gap:12px; font-size:13.5px; font-weight:700; color:var(--ink); }
  .menu-ic{ width:34px;height:34px;border-radius:10px; background:var(--teal-100); display:flex;align-items:center;justify-content:center; color:var(--teal-700); }

  .fadein{ animation:fadein .25s ease; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

  .fab-menu{ position:absolute; bottom:96px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:10px; z-index:40; }
  .fab-menu-item{
    display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--border); border-radius:16px;
    padding:12px 18px; box-shadow:var(--shadow-sm); font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .fab-menu-item .fmi-ic{ width:30px;height:30px;border-radius:9px; display:flex;align-items:center;justify-content:center; }

  .toast{
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:12px; font-size:12.5px; font-weight:700;
    box-shadow:var(--shadow-sm); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:80;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #printArea{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block; position:absolute; inset:0; padding:24px; }
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="screen" class="screen"></div>

  <div id="fabMenuHolder"></div>

  <div class="bottomnav">
    <button class="nav-item" data-nav="home"><span data-ic="home"></span><span>خانه</span></button>
    <button class="nav-item" data-nav="expenses"><span data-ic="list"></span><span>هزینه‌ها</span></button>
    <button class="fab" id="fabBtn"><span data-ic="plus" data-c="26"></span></button>
    <button class="nav-item" data-nav="assets"><span data-ic="layers"></span><span>دارایی‌ها</span></button>
    <button class="nav-item" data-nav="profile"><span data-ic="user"></span><span>پروفایل</span></button>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<div id="printArea"></div>

<script>
/* ---------------- ICONS ---------------- */
const ICONS = {
  home: `<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/>`,

  layers: `<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/>`,

  menu: `<path d="M4 7h16M4 12h16M4 17h16"/>`,
  pencil: `<path d="m14.5 5.5 4 4L8 20H4v-4L14.5 5.5Z"/>`,
  x: `<path d="M6 6l12 12M18 6 6 18"/>`,
  check: `<path d="M5 12.5 9.5 17 19 7"/>`,
  calendar: `<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/>`,
  tag: `<path d="M12.5 3H5a2 2 0 0 0-2 2v7.5a2 2 0 0 0 .6 1.4l8.6 8.6a2 2 0 0 0 2.8 0l7-7a2 2 0 0 0 0-2.8l-8.6-8.6A2 2 0 0 0 12.5 3Z"/><circle cx="8.2" cy="8.2" r="1.4" fill="currentColor" stroke="none"/>`,
  wallet: `<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v2"/><path d="M3 7.5v10A2.5 2.5 0 0 0 5.5 20H19a1 1 0 0 0 1-1v-4"/><rect x="14" y="11" width="8" height="6" rx="2"/><circle cx="17.3" cy="14" r="1" fill="currentColor" stroke="none"/>`,
  trash: `<path d="M4 7h16"/><path d="M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/><path d="M6 7l1 12.5A2 2 0 0 0 9 21h6a2 2 0 0 0 2-1.5L18 7"/><path d="M10 11v6M14 11v6"/>`,
  chevL: `<path d="M15 6l-6 6 6 6"/>`,
  cart: `<circle cx="9.5" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/>`,
  bus: `<rect x="3.5" y="5" width="17" height="12" rx="3"/><path d="M3.5 12h17"/><circle cx="7.5" cy="19.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="16.5" cy="19.5" r="1.3" fill="currentColor" stroke="none"/><path d="M6.5 8.5h4M14 8.5h3.5"/>`,
  bolt: `<path d="M13 2 4.5 13.5H11L10.2 22 19.5 9.5H13L13 2Z"/>`,
  bag: `<path d="M6.5 8h11l1 12.5A2 2 0 0 1 16.5 22h-9a2 2 0 0 1-2-1.5L6.5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>`,
  dots: `<circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/>`,
  gold: `<path d="M3 16.5 8 8h8l5 8.5-5 6H8l-5-6Z"/><path d="M8 8l4 4-4 8.5M16 8l-4 4 4 8.5"/>`,
  dollar: `<circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M15 9c0-1.5-1.5-2.5-3-2.5s-3 .9-3 2.3c0 3 6 1.7 6 4.7 0 1.5-1.5 2.5-3 2.5s-3-1-3-2.5"/>`,

/* ---- Jalali (Solar Hijri) calendar helpers, via Intl (reliable, no hand-rolled calendar math) ---- */
const MONTH_NAMES_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function faDigitsToEn(s){ return s.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); }
function jalaliParts(date){
  try{
    const fmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {year:'numeric', month:'numeric', day:'numeric'});
    const parts = fmt.formatToParts(date);
    const get = t => parts.find(p=>p.type===t).value;
    return {
      jy: parseInt(faDigitsToEn(get('year'))),
      jm: parseInt(faDigitsToEn(get('month'))),
      jd: parseInt(faDigitsToEn(get('day')))
    };
  }catch(e){
    // fallback: treat Gregorian month as-is if Intl/Jalali calendar unsupported
    return { jy: date.getFullYear(), jm: date.getMonth()+1, jd: date.getDate() };
  }
}
function monthKeyOf(jy, jm){ return `${jy}-${jm}`; }
function monthLabelOf(jy, jm){ return `${MONTH_NAMES_FA[jm-1]} ${fa(jy)}`; }

function applyMonthRollover(){
  const { jy, jm } = jalaliParts(new Date());
  const key = monthKeyOf(jy, jm);
  if(!state.currentMonthKey){
    state.currentMonthKey = key;
    state.monthLabel = monthLabelOf(jy, jm);
    return;
  }
  if(state.currentMonthKey !== key){
    const spent = state.expenses.reduce((s,e)=>s+Number(e.amount||0),0);
    state.history = state.history || [];
    state.history.push({
      key: state.currentMonthKey,
      label: state.monthLabel,
      salary: state.salary,
      expenses: state.expenses,
      spent,
      closedAt: Date.now()
    });
    state.expenses = [];
    state.currentMonthKey = key;
    state.monthLabel = monthLabelOf(jy, jm);
  }
}

/* ---------------- LIVE GOLD/DOLLAR PRICES (Tindex API, auto every 60s) ---------------- */
let priceIntervalHandle = null;
const TINDEX_BOARDS_ENDPOINT = 'https://tindex.app/api/public/boards';

function findBoardRow(boards, boardKey, slug){
  const board = Array.isArray(boards) ? boards.find(b => b && b.key === boardKey) : null;
  return board && Array.isArray(board.rows) ? board.rows.find(x => String(x.slug||'').toUpperCase() === slug.toUpperCase()) : null;
}
function applyTindexPriceData(data){
  const boards = data && Array.isArray(data.data) ? data.data : [];
  const usdItem = findBoardRow(boards, 'currency', 'USD-EXCHANGE-RATE');
  const goldItem = findBoardRow(boards, 'gold', 'GOLD-18K');
  if(!usdItem && !goldItem) return false;
  if(usdItem && Number(usdItem.price) > 0) state.settings.dollarRate = Math.round(Number(usdItem.price));
  if(goldItem && Number(goldItem.price) > 0) state.settings.goldPrice = Math.round(Number(goldItem.price));
  const timestamps = [usdItem?.updated_at, goldItem?.updated_at].filter(Boolean).map(x=>Date.parse(x)).filter(Number.isFinite);
  state.settings.pricesUpdatedAt = timestamps.length ? Math.max(...timestamps) : Date.now();
  return true;
}
async function fetchLivePrices(){
  const token = (state.settings.tindexApiToken||'').trim();
  if(!token) return { ok:false, reason:'برای دریافت خودکار، توکن رایگان Tindex را وارد کنید.' };
  try{
    const res = await fetch(TINDEX_BOARDS_ENDPOINT, {
      cache:'no-store',
      headers:{ Authorization:`Bearer ${token}`, Accept:'application/json' }
    });
    if(!res.ok) return { ok:false, reason:`خطای API تیندکس (${res.status})` };
    const data = await res.json();
    if(applyTindexPriceData(data)){ await saveState(); return { ok:true }; }
    return { ok:false, reason:'داده معتبر دلار یا طلای ۱۸ عیار از تیندکس دریافت نشد.' };
  }catch(e){
    return { ok:false, reason:'اتصال به تیندکس ناموفق بود (شبکه/CORS).' };
  }
}
function startPriceAutoRefresh(){
  stopPriceAutoRefresh();
  if(state.settings.autoPrices===false) return;
  fetchLivePrices().then(()=> render());
  priceIntervalHandle = setInterval(async ()=>{
    await fetchLivePrices();
    render();
  }, 60000);
}
function stopPriceAutoRefresh(){
  if(priceIntervalHandle){ clearInterval(priceIntervalHandle); priceIntervalHandle = null; }
}

    <div class="field">
      <label>منبع تأمین مالی</label>
      <div class="cat-grid" id="sourceGrid" style="grid-template-columns:1fr 1fr;">
        <button type="button" class="cat-item ${source==='salary'?'active':''}" data-source="salary">
          <span class="ci-ic" style="background:var(--teal-100);color:var(--teal-700)">${ic('wallet',16)}</span>
          <span>از حقوق این ماه</span>
        </button>
        <button type="button" class="cat-item ${source==='other'?'active':''}" data-source="other">
          <span class="ci-ic" style="background:#eef2f4;color:var(--cat-other)">${ic('layers',16)}</span>
          <span>از جای دیگر</span>
        </button>
      </div>
      <div id="sourceHint" style="font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.7;"></div>
    </div>
    <button class="primary-btn" id="saveAssetBtn" style="margin-top:6px;">${ic('check',17)} ${existing?'ذخیره تغییرات':'افزودن'}</button>
    ${existing?`<button class="ghost-btn" id="deleteAssetBtn">${ic('trash',15)} حذف این دارایی</button>`:''}
  `;
}
function assetFieldsHTML(type, vals){
  if(type==='gold'){
    return `
      <div class="field"><label>وزن طلا (گرم)</label><input type="number" class="text-input" id="af1" value="${vals.gGrams}" placeholder="مثلاً ۱۸"></div>
      <div class="field"><label>قیمت هر گرم (تومان)</label><input type="number" class="text-input" id="af2" value="${vals.gPrice}" placeholder="مثلاً ۸۰۰۰۰۰۰"></div>`;
  }
  if(type==='dollar'){
    return `
      <div class="field"><label>تعداد دلار</label><input type="number" class="text-input" id="af1" value="${vals.dCount}" placeholder="مثلاً ۵۰۰"></div>
      <div class="field"><label>نرخ هر دلار (تومان)</label><input type="number" class="text-input" id="af2" value="${vals.dRate}" placeholder="مثلاً ۱۶۵۰۰۰۰"></div>`;
  }
  if(type==='cash'){
    return `<div class="field"><label>مبلغ پس‌انداز (تومان)</label><input type="number" class="text-input" id="af1" value="${vals.cAmt}" placeholder="۰"></div>`;
  }
  return `<div class="field"><label>ارزش سرمایه‌گذاری (تومان)</label><input type="number" class="text-input" id="af1" value="${vals.iAmt}" placeholder="۰"></div>`;
}
function bindAssetFormEvents(existing){
  bindSheetCommon();
  let sourceSel = existing ? (existing.source || 'other') : 'other';
  document.querySelectorAll('#typeGrid .type-item').forEach(btn=>{
    btn.onclick = ()=>{
      editingAssetType = btn.dataset.type;
      document.querySelectorAll('#typeGrid .type-item').forEach(b=>b.classList.toggle('active', b===btn));
      document.getElementById('assetFields').innerHTML = assetFieldsHTML(editingAssetType, {gPrice:state.settings.goldPrice||'', dRate:state.settings.dollarRate||''});
    };
  });
  function updateSourceHint(){
    const hint = document.getElementById('sourceHint');
    if(!hint) return;
    hint.textContent = sourceSel==='salary'
      ? 'این مبلغ به‌عنوان هزینه از باقی‌مانده حقوق این ماه کسر می‌شود.'
      : 'این مبلغ روی باقی‌مانده حقوق این ماه تأثیری نمی‌گذارد.';
  }
  document.querySelectorAll('#sourceGrid .cat-item').forEach(btn=>{
    btn.onclick = ()=>{
      sourceSel = btn.dataset.source;
      document.querySelectorAll('#sourceGrid .cat-item').forEach(b=>b.classList.toggle('active', b===btn));
      updateSourceHint();
    };
  });
  updateSourceHint();

  document.getElementById('saveAssetBtn').onclick = async ()=>{
    let a = { id: existing?existing.id:uid(), type:editingAssetType };
    if(editingAssetType==='gold'){
      const g = Number(document.getElementById('af1').value)||0;
      const p = Number(document.getElementById('af2').value)||0;
      a.qty=g; a.rate=p; a.value=g*p; a.sub=`${fa(g)} گرم`;
    } else if(editingAssetType==='dollar'){
      const c = Number(document.getElementById('af1').value)||0;
      const r = Number(document.getElementById('af2').value)||0;
      a.qty=c; a.rate=r; a.value=c*r; a.sub=`${fa(c)} دلار`;
    } else if(editingAssetType==='cash'){
      const v = Number(document.getElementById('af1').value)||0;
      a.value=v; a.sub='پس‌انداز نقدی';
    } else {
      const v = Number(document.getElementById('af1').value)||0;
      a.value=v; a.sub='سرمایه‌گذاری';
    }
    if(a.value<=0) return;

    // remove any previously-linked salary expense before (re)creating one, to avoid duplicates on edit
    if(existing && existing.linkedExpenseId){
      state.expenses = state.expenses.filter(x=>x.id!==existing.linkedExpenseId);
    }
    a.source = sourceSel;
    a.linkedExpenseId = null;
    if(sourceSel==='salary'){
      const expId = uid();
      state.expenses.push({ id:expId, amount:a.value, category:'saving', date:todayFa(), note:`انتقال به دارایی: ${ATYPES[editingAssetType].label}`, ts:Date.now() });
      a.linkedExpenseId = expId;
    }

    const idx = state.assets.findIndex(x=>x.id===a.id);
    if(idx>=0) state.assets[idx]=a; else state.assets.push(a);
    await saveState(); closeSheet(); render();
  };
  if(existing){
    document.getElementById('deleteAssetBtn').onclick = async ()=>{
      if(existing.linkedExpenseId){
        state.expenses = state.expenses.filter(x=>x.id!==existing.linkedExpenseId);
      }
      state.assets = state.assets.filter(x=>x.id!==existing.id);
      await saveState(); closeSheet(); render();
    };
  }
}

function bindSheetCommon(){
  document.getElementById('closeSheetBtn').onclick = closeSheet;
}

/* ---------------- FAB MENU ---------------- */
let fabOpen = false;
function toggleFabMenu(){
  fabOpen = !fabOpen;
  const holder = document.getElementById('fabMenuHolder');
  if(fabOpen){
    holder.innerHTML = `
      <div class="fab-menu fadein">
        <div class="fab-menu-item" id="fmAddAsset"><span class="fmi-ic" style="background:var(--amber-bg);color:var(--amber)">${ic('gold',15)}</span>افزودن دارایی</div>
        <div class="fab-menu-item" id="fmAddExpense"><span class="fmi-ic" style="background:var(--teal-100);color:var(--teal-700)">${ic('tag',15)}</span>ثبت هزینه</div>
      </div>`;
    document.getElementById('fmAddExpense').onclick = ()=>{ toggleFabMenu(); sheetAddExpense(); };
    document.getElementById('fmAddAsset').onclick = ()=>{ toggleFabMenu(); sheetAddAsset(null); };
  } else {
    holder.innerHTML = '';
  }
}
document.getElementById('fabBtn').onclick = toggleFabMenu;

/* ---------------- NAV / EVENTS ---------------- */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(fabOpen) toggleFabMenu();
    nav = btn.dataset.nav;
    render();
  });
});

function bindScreenEvents(){
  const editSalary = document.getElementById('editSalaryBtn');
  if(editSalary) editSalary.onclick = sheetEditSalary;
  const editSalary2 = document.getElementById('editSalaryBtn2');
  if(editSalary2) editSalary2.onclick = sheetEditSalary;
  const editName = document.getElementById('editNameBtn');
  if(editName) editName.onclick = sheetEditName;
  const editRates = document.getElementById('editRatesBtn');
  if(editRates) editRates.onclick = sheetEditRates;
  const historyBtn = document.getElementById('historyBtn');
  if(historyBtn) historyBtn.onclick = sheetHistoryList;
  const copyMonthBtn = document.getElementById('copyMonthBtn');
  if(copyMonthBtn) copyMonthBtn.onclick = async ()=>{
    const ok = await copyMonthReport(currentMonthRecord());
    showToast(ok? 'گزارش کپی شد':'کپی ناموفق بود');
  };
  const printMonthBtn = document.getElementById('printMonthBtn');
  if(printMonthBtn) printMonthBtn.onclick = ()=> printMonthReport(currentMonthRecord());
  const addAsset = document.getElementById('addAssetBtn');
  if(addAsset) addAsset.onclick = ()=> sheetAddAsset(null);
  const refreshPricesBtn = document.getElementById('refreshPricesBtn');
  if(refreshPricesBtn) refreshPricesBtn.onclick = async ()=>{
    const r = await fetchLivePrices();
    showToast(r.ok? 'نرخ‌ها به‌روزرسانی شد' : 'ناموفق: '+r.reason);
    render();
  };
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = async ()=>{
    if(confirm('همه اطلاعات (شامل تاریخچه ماه‌ها) پاک شود؟')){
      state = { name: state.name, monthLabel:'', currentMonthKey:'', salary:0, expenses:[], assets:[], history:[], settings:{goldPrice:'',dollarRate:''} };
      applyMonthRollover();
      await saveState(); render();
    }
  };
  document.querySelectorAll('[data-nav-to]').forEach(el=>{
    el.onclick = ()=>{ nav = el.dataset.navTo; render(); };
  });
  document.querySelectorAll('[data-del-tx]').forEach(el=>{
    el.onclick = async (ev)=>{
      ev.stopPropagation();
      state.expenses = state.expenses.filter(x=>x.id!==el.dataset.delTx);
      await saveState(); render();
    };
  });
  document.querySelectorAll('[data-asset]').forEach(el=>{
    el.onclick = ()=>{
      const a = state.assets.find(x=>x.id===el.dataset.asset);
      if(a) sheetAddAsset(a);
    };
  });
}

loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
